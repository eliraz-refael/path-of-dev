[package]
name = "pathofdev"
version = "0.1.0"
description = "The Path of Dev companion: the game in a terminal pane beside Claude Code"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pathofdev"
path = "src/main.rs"

[dependencies]
jiff = "0.2.38"
ratatui = "0.30.2"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = { version = "0.12.0", default-features = false }
# The Unix-socket connector implements ureq's `unversioned` transport traits, which may change in any release.
ureq = { version = "=3.4.2", features = ["json"] }

[dev-dependencies]
proptest = "1.12"
serde_ignored = "0.1.14"

[lints]
workspace = true
